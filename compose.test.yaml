# Use with: docker compose -p ours-test -f compose.yaml -f compose.test.yaml up -d --build
services:
  api:
    image: ours-api:latest
    environment:
      APP_URL: http://localhost:${TEST_PORT:-18080}
  web:
    image: ours-web:latest
    ports: !override
      - '127.0.0.1:${TEST_PORT:-18080}:8080'
